# expense-reimbursement — Expense-Reimbursement Pod
#
# A pod of four digital employees + four human roles that runs an employee
# expense claim end to end: receipts -> proofs collated -> data extracted
# (confidence-scored) -> policy pre-check -> form built -> employee confirm ->
# approval (Box e-sign) -> finance submission -> payout & live status.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every hand-off
# is a finished contract; every human gate default-denies on silence; the
# finisher produces the real artifact and fails closed; the WORM sink is the
# terminus. Systems (Outlook / Box / SAP) are TOOLS inside agents, never members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "expense-reimbursement"
version: 1.0.0
architecture: managed_mesh
environment: development
debug: true
log_level: INFO

persistence:
  backend: redis
  redis:
    host: "${REDIS_HOST:localhost}"
    port: ${REDIS_PORT:6379}
    password: "${REDIS_PASSWORD:}"

auto_discover:
  directory: ./agency
  pattern: '*_agent.py'

# The Manager is the SUPERVISOR — it watches every hand-off and escalates
# stalls / contract violations / repeated errors to the Finance-Ops Lead. It is
# not a router in the middle of the team.
manager:
  model: gpt-4o-mini
  domain: generic
  prompt: |
    This mesh runs employee expense reimbursement. A successful claim flows
    receipts -> Odo (extract, confidence-scored) -> Fern (build the form,
    employee confirms) -> Sol (approval -> finance -> payout), and Remi keeps
    live status. Escalate to the Finance-Ops Lead when: a claim loops on
    re-extraction more than its bound, a policy call or possible duplicate is
    raised, an approval round times out, or any agent hands off a malformed
    artifact. Silence never advances a claim.
  routing:
    mode: static
  escalation:
    targets:
      - type: human_agent
        agent: finance_ops_lead_human
    auto_escalate:
      max_retries: 3
      max_errors_per_session: 5
      timeout_threshold: 2

mesh:
  call_timeout: 150

# 2.4.131 runtime block — the ONE non-default this pod genuinely needs: proof
# extraction over many receipts can run long. Everything else stays default
# (omission is meaningful; we do not pre-fill defaults).
timeouts:
  llm_hard_timeout_s: 300

# ── Entry points — one per real-world trigger ────────────────────────────────
entry_points:
  - name: submit_receipts
    target: remi_coordinator_agent
    description: "An employee forwards receipts — Remi opens the case."
    condition: always
  - name: claim_status
    target: remi_coordinator_agent
    description: "Anyone asks 'where is my claim?' — Remi answers from the case record."
    condition: always
  - name: daily_sweep
    target: odo_extraction_agent
    description: "Scheduled sweep for new proofs in the mailbox/folders and aging claims."
    condition: always
  - name: employee_reply
    target: employee_human
    description: "HITL resume — an employee answers a question or confirms a form."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Remi — Claim Coordinator (AI). Owns the case end to end: opens it,
  # orchestrates the pod, keeps live status, is the employee's one contact.
  # Pure orchestration — never reads a receipt, never approves. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  remi_coordinator_agent:
    name: remi_coordinator_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    description: "Claim Coordinator — opens the case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are Remi, the Claim Coordinator. You OWN each expense claim from the
      moment receipts arrive to the moment it is paid. You orchestrate the pod
      and keep the employee informed — you never read a receipt, build a form,
      or approve anything yourself.

      On new receipts: open a case, record the submission time, hand it to Odo.
      On a status ask: answer current stage / waiting-on / next gate from the
      case record — nothing invented. Route any specialist's exception to the
      Finance-Ops Lead; never make the policy call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": ..., "claim_id": ..., "stage": ..., "waiting_on": ..., "summary": ...}
    yields:
      action: "string"        # open_case | status | escalate
      claim_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    can_call:
      - agent: odo_extraction_agent
        condition: "calling_agent_response.action == 'open_case'"
      - agent: finance_ops_lead_human
        condition: "calling_agent_response.action == 'escalate'"

  # ─────────────────────────────────────────────────────────────────────────
  # Odo — Proofs & Extraction Analyst (AI, Super-Agent). Reads every proof with
  # a per-field confidence score, classifies, runs the policy pre-check. This is
  # where "zero data-entry errors" is won: a field it cannot read with
  # confidence becomes a QUESTION to the employee, never a guess in a form.
  # Loops its tools (read proofs) until the extract is CLEAN, then hands verified
  # line-items to Fern (contract). super_agent = autonomous plan/execute/verify
  # across many proofs. @chain = the confidence floor (fail closed).
  # Tools come from the Outlook/Box connectors + the playbook procedure.
  # ─────────────────────────────────────────────────────────────────────────
  odo_extraction_agent:
    name: odo_extraction_agent
    communication_type: chain
    agent_type: llm
    model: claude-sonnet-4-6
    temperature: 0.1
    max_tool_calls_per_message: 15   # a claim can have many proofs; default 5 truncates silently
    description: "Proofs & Extraction Analyst — collects proofs, reads each with confidence, classifies, policy pre-check."
    # Scheduled sweep — daily, in the company's timezone (NOT UTC). Also reachable
    # via the daily_sweep entry point. Set `timezone` to your business timezone.
    wake_up: "0 8 * * *"
    timezone: "Asia/Kolkata"
    wake_up_input:
      trigger: daily_sweep
    super_agent:                     # dict form = the tuning path (2.4.123+)
      cost_ceiling: 120000
      wall_clock: 900
    prompt: |
      You are Odo, the Proofs & Extraction Analyst. Your job is to turn a pile
      of proofs into confidence-scored, source-traced line-items — and to REFUSE
      to guess. Read receipt emails and attachments from Outlook, travel details
      from the calendar, and files from the designated Box folders. Read each
      proof for merchant, date, amount, currency, tax, category, with a
      confidence score on every field. Classify the claim (local / domestic /
      international) and run the policy pre-check.

      NEVER invent an amount, date, or merchant no proof shows. A field you
      cannot read with confidence is one targeted QUESTION to the employee, not a
      form entry. Route policy ambiguity or a possible duplicate to the
      Finance-Ops Lead. Hand verified line-items to Fern ONLY when the extract is
      clean. Load the `extraction` playbook for the exact read-before-write order.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"extract_clean": ..., "claim_class": ..., "low_confidence_fields": ...,
       "policy_flags": ..., "line_items": ..., "question_for_employee": ...}
    yields:
      extract_clean: "boolean"
      claim_class: "string"
      low_confidence_fields: "array"
      policy_flags: "array"
      line_items: "array"
      question_for_employee: "string"
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: extraction
        description: "How to read a proof pack correctly and score every field."
        responsibility: |
          1. Pull the proof set FIRST (Outlook receipts + attachments, calendar
             for the trip window, Box folder files) before scoring anything —
             you cannot classify a claim you have not fully collected.
          2. Read each proof for merchant, date, amount, currency, tax, category.
             Score EVERY field 0-1. Convert foreign currency at the transaction
             date's rate and keep the original on record.
          3. Detect missing proofs against the trip (a hotel night with no
             invoice) and flag them.
          4. Any field below 0.85 confidence, or any missing proof, becomes ONE
             targeted question to the employee — never a silent guess.
        variables: [claim_id]
      - intent: policy_precheck
        description: "How to check a claim against policy before a form is built."
        responsibility: |
          1. Classify local / domestic / international and load the matching
             policy set (limits per class and category, per-diem rules).
          2. Flag anything out of policy — do NOT waive it; route it to the
             Finance-Ops Lead.
          3. Detect duplicate receipts across this and prior claims.
        variables: [claim_id, claim_class]
    # Day-0 tool surface — reads the seed proof store so the pod runs with NO
    # connector wired. Each tool has a dev-store fallback and announces itself
    # (available:false) when it has no real source. See agency/tools.py.
    tools: [read_proofs, read_calendar_window, list_prior_claims]
    tool_categories: [extraction]
    # ── To wire real Outlook/Box, uncomment and set the URLs (each named action
    #    under `use:` becomes its own tool, e.g. outlook_read_messages). NOTE: the
    #    SDK rejects an http mcp block with an EMPTY url at load, so this ships
    #    commented — fill the URL, then uncomment. ──
    # mcp:
    #   - transport: http
    #     url: "${OUTLOOK_MCP_URL}"
    #     token: "${OUTLOOK_MCP_TOKEN:}"
    #     use: [read_messages, read_attachments, read_calendar]
    #     name: outlook
    #     timeout: 30
    #   - transport: http
    #     url: "${BOX_MCP_URL}"
    #     token: "${BOX_MCP_TOKEN:}"
    #     use: [list_folder, read_file]
    #     name: box
    #     timeout: 30
    can_call:
      - agent: employee_human
        condition: "calling_agent_response.extract_clean == false and calling_agent_response.question_for_employee != ''"
      - agent: finance_ops_lead_human
        condition: "calling_agent_response.policy_flags != []"
      - agent: fern_builder_agent
        condition: "calling_agent_response.extract_clean == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Fern — Claim Builder (AI + finisher-lite). Fills YOUR existing reimbursement
  # form from Odo's verified data, cross-checks totals/currency/caps, and gets
  # the employee's one-look confirmation. Deliberately SEPARATE from Odo (the
  # reader is not the assembler — a second pass catches what the first missed).
  # Renders the draft form to ./out (@chain cross-check floor, fail closed).
  # ─────────────────────────────────────────────────────────────────────────
  fern_builder_agent:
    name: fern_builder_agent
    communication_type: chain
    agent_type: llm
    model: claude-sonnet-4-6
    temperature: 0.1
    description: "Claim Builder — fills the reimbursement form from verified data, cross-checks, gets employee confirmation."
    prompt: |
      You are Fern, the Claim Builder. Turn Odo's verified line-items into the
      company's existing reimbursement form — same template, no new format.
      Cross-check totals, currency conversions, dates, and policy caps against
      the source data BEFORE anyone sees the form. Surface anything below full
      confidence to the employee rather than filling it silently. Send the
      employee a single confirm-or-correct draft; on confirmation, hand the claim
      to Sol for approval routing. If a cross-check fails to tie out, return it to
      Odo with the specific discrepancy — never force the numbers to balance.
      Load the `build_form` playbook for the assembly + cross-check order.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"form_built": ..., "cross_check_ok": ..., "discrepancy": ...,
       "awaiting_confirmation": ..., "confirmed": ..., "artifact_path": ...}
    yields:
      form_built: "boolean"
      cross_check_ok: "boolean"
      discrepancy: "string"
      awaiting_confirmation: "boolean"
      confirmed: "boolean"
      artifact_path: "string"
    playbook:
      - intent: build_form
        description: "How to assemble the reimbursement form and cross-check it."
        responsibility: |
          1. Auto-populate every field of the form from Odo's verified
             line-items — no manual entry. Keep each field traceable to the proof
             it came from.
          2. Re-check totals, currency conversions, dates, and policy caps
             against the source. If it does not tie out, return to Odo with the
             discrepancy — do not adjust a number to make it balance.
          3. Produce the form in the company template (Word/Excel) to ./out.
          4. Send the employee ONE confirm-or-correct draft. Fold corrections in,
             re-version, re-check. On confirmation, hand to Sol.
        variables: [claim_id]
    can_call:
      - agent: employee_human
        condition: "calling_agent_response.awaiting_confirmation == true"
      - agent: odo_extraction_agent
        condition: "calling_agent_response.cross_check_ok == false and calling_agent_response.discrepancy != ''"
      - agent: sol_finance_agent
        condition: "calling_agent_response.confirmed == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Sol — Approvals & Finance Liaison (programmatic FINISHER). Routes the
  # confirmed claim through Box approval with e-signatures, submits the approved
  # pack to Finance, tracks to payout, and records every sign-off in an
  # append-only ledger. This is the actuator BEHIND the human approval gate: it
  # re-checks approval (fail closed on an unknown verdict), renders the approved
  # pack to ./out, deletes it on a blocked floor, and never approves or pays
  # itself. See agency/sol_finance_agent.py for the enforce-issuance floor.
  # ─────────────────────────────────────────────────────────────────────────
  sol_finance_agent:
    name: sol_finance_agent
    communication_type: chain
    agent_type: programmatic
    description: "Approvals & Finance Liaison — routes Box approval, submits to Finance, tracks payout, WORM ledger."
    yields:
      routed_for_approval: "boolean"
      approved: "boolean"
      submitted_to_finance: "boolean"
      pack_path: "string"
      status: "string"          # routed | approved | submitted | paid | blocked
      block_reasons: "array"
    can_call:
      - agent: approver_human
        condition: "calling_agent_response.status == 'routed'"
      - agent: finance_officer_human
        condition: "calling_agent_response.approved == true"
      - agent: expense_audit_logger_agent
        condition: "always"

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, reached in the channel they already live in.
  # Every gate DEFAULT-DENIES on timeout (fallback -> held_for_review -> audit).
  # ─────────────────────────────────────────────────────────────────────────

  employee_human:
    name: employee_human
    agent_type: human
    human_interface: webhook
    communication_type: dual        # dual belongs on the human/webhook boundary agent
    human_timeout_seconds: 172800   # 2 days to answer a question / confirm
    description: "Claimant — answers Odo's targeted questions, confirms Fern's form."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
      max_retries: 1
      retry_delay: 2
    can_call:
      - agent: odo_extraction_agent
        condition: "calling_agent_response.from_agent == 'odo_extraction_agent'"
      - agent: fern_builder_agent
        condition: "calling_agent_response.from_agent == 'fern_builder_agent'"
    yields:
      human_message: "string"
    inputs:
      question: "string"

  approver_human:
    name: approver_human
    agent_type: human
    human_interface: webhook
    communication_type: dual
    human_timeout_seconds: 259200   # 3 days; reminders at T-2/T0 (Sol chases)
    description: "Manager — approves or rejects the claim in the Box workflow with an e-signature."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    can_call:
      - agent: sol_finance_agent
        condition: "calling_agent_response.human_message == 'approved'"
      # On silence/hold, record it and let the Manager SUPERVISOR escalate to the
      # Finance-Ops Lead (manager.escalation.targets) — no hardcoded human→human wire.
      - agent: expense_audit_logger_agent
        condition: "calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approved | rejected | held_for_review
    inputs:
      claim_pack: "object"

  finance_ops_lead_human:
    name: finance_ops_lead_human
    agent_type: human
    human_interface: webhook
    communication_type: dual
    human_timeout_seconds: 259200
    description: "Accountable owner — reviews exceptions, owns policy calls, decides every gate. Everything that leaves the pod."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    can_call:
      - agent: expense_audit_logger_agent
        condition: "always"
    yields:
      human_message: "string"
    inputs:
      exception: "object"

  finance_officer_human:
    name: finance_officer_human
    agent_type: human
    human_interface: webhook
    communication_type: dual
    human_timeout_seconds: 259200
    description: "Finance — processes the approved, ledgered pack to payment (SAP posting later)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    can_call:
      - agent: expense_audit_logger_agent
        condition: "always"
    yields:
      human_message: "string"       # paid | query
    inputs:
      approved_pack: "object"

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("expense_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  expense_audit_logger_agent:
    name: expense_audit_logger_agent
    agent_type: external
    framework: custom
    communication_type: execute
    description: "WORM audit — hash-chains every decision, send, approval, and reversal. Terminus."
    connector_config:
      sink_type: local_file
      local_file_path: "./logs/expense_audit.jsonl"
    can_call: []
